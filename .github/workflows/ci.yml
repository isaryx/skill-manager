name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
      - name: Validate install scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -P scripts -x scripts/install.sh scripts/check-update.sh scripts/lib/github-release.sh
          bash -n scripts/install.sh scripts/check-update.sh scripts/lib/github-release.sh
          version=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          bash scripts/install.sh --dry-run --version "$version"
          bash scripts/check-update.sh --current "$version" --latest "$version"
          set +e
          bash scripts/check-update.sh --json --current 0.0.0 --latest "$version" >/tmp/check-update-outdated.json
          update_code=$?
          set -e
          [[ "$update_code" -eq 1 ]]
          grep -q '"update_available":true' /tmp/check-update-outdated.json
          bash scripts/check-update.sh --json --current "$version" --latest "$version" | grep -q '"update_available":false'
          bash scripts/check-update.sh --current 99.0.0 --latest "$version"

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
