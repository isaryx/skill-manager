[package]
name = "skill-manager"
version = "0.3.0"
edition = "2021"
description = "Manage AI agent skills from one local store — profiles, symlinks, and sync for Claude Code, Cursor, and more"
authors = ["Vu Tran"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/isaryx/skill-manager"
homepage = "https://github.com/isaryx/skill-manager"

[[bin]]
name = "skm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
directories = "6"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
serde_json = "1"
tempfile = "3"
clap_complete = "4"

[profile.release]
strip = true
lto = true
codegen-units = 1
